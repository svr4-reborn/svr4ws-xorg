Section "Device"
    Identifier "SVR4WS Device"
    Driver "svr4ws"
    Option "Device" "/dev/kd/kdvm00"
    Option "VT" "/dev/vt00"
    Option "Mode" "cirrus800x600x16"
    # The Cirrus chip is auto-detected from CRTC register 0x27.  Uncomment to
    # force a specific part (GD5424/GD5426/GD5428/GD5429/GD5430/GD5434/...) if
    # detection is wrong.  GD5420 and GD5422 are 8bpp-only and unsupported.
    # Option "Chipset" "GD5429"
EndSection

Section "Monitor"
    Identifier "SVR4WS Monitor"
EndSection

Section "Screen"
    Identifier "SVR4WS Screen"
    Device "SVR4WS Device"
    Monitor "SVR4WS Monitor"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Modes "800x600"
        Virtual 800 600
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "SVR4WS Layout"
    Screen "SVR4WS Screen"
    # Input devices are defined in 40-svr4xqueue.conf (xf86-input-svr4xqueue).
    InputDevice "SVR4XQ Keyboard" "CoreKeyboard"
    InputDevice "SVR4XQ Pointer" "CorePointer"
EndSection
